<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ETF 觀察表</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETF觀察">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 手機優先。上方資料狀態與摘要、中間卡片清單、底部分頁列，點卡片彈出底部面板 */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --fg:#1b2220; --muted:#66706b; --line:#dfe3e0;
  --accent:#1f6b5c; --on-accent:#ffffff; --up:#c8312b; --down:#1f8a4c; --up-bg:#fdeceb; --down-bg:#e6f3eb;
  --warn:#9a6700; --warn-bg:#fff5d6; --scrim:rgba(10,14,12,.45);
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --surface:#1a201e; --fg:#e7ece9; --muted:#97a19c; --line:#2b3330;
  --accent:#5fbfa8; --on-accent:#0f1312; --up:#ff6b62; --down:#4fca82; --up-bg:#3a1e1c; --down-bg:#15301f;
  --warn:#f2c14e; --warn-bg:#352a0e; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --surface:#1a201e; --fg:#e7ece9; --muted:#97a19c; --line:#2b3330;
  --accent:#5fbfa8; --on-accent:#0f1312; --up:#ff6b62; --down:#4fca82; --up-bg:#3a1e1c; --down-bg:#15301f;
  --warn:#f2c14e; --warn-bg:#352a0e; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.page{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:1.45rem;margin:0}
h2{font-size:1.1rem;margin:0}
a{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.status{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.8rem;color:var(--muted)}
.status b{color:var(--fg);font-family:var(--mono);font-weight:500}
.warnline{margin-top:6px;background:var(--warn-bg);color:var(--fg);border-radius:8px;padding:6px 10px}
.warnline b{color:var(--warn)}
.badge{display:inline-block;font-size:.68rem;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.stat{flex:0 0 46%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--mono);font-size:1.15rem;font-weight:600}
.stat .s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
select{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.card:active{transform:scale(.99)}
.card .code{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.9rem}
.card .name{font-weight:500;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .px{font-family:var(--mono);font-size:1.15rem;font-weight:600;text-align:right}
.card .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.card .meta b{color:var(--fg);font-family:var(--mono);font-weight:500}
.tag{font-size:.68rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;vertical-align:2px;font-weight:400}
.prem{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--mono);font-size:.82rem;text-align:right}
.prem.hi{background:var(--up-bg);color:var(--up);font-weight:600}
.prem.lo{background:var(--down-bg);color:var(--down);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.hold{display:grid;grid-template-columns:minmax(6.5em,1.3fr) 1fr auto;gap:8px 10px;align-items:center;font-size:.86rem}
.hold>div{min-width:0;overflow-wrap:anywhere}
.hold .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hold small{display:block;color:var(--muted);font-size:.72rem}
.barw{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.barw i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.kv .k{font-size:.7rem;color:var(--muted)}
.kv .v{font-family:var(--mono);font-weight:600;overflow-wrap:anywhere}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.86rem}
.rows dt{color:var(--muted)}
.rows dd{margin:0;text-align:right;font-family:var(--mono)}
.matrix{overflow-x:auto}
.matrix table{border-collapse:separate;border-spacing:3px;font-size:.78rem}
.matrix th{font-family:var(--mono);font-weight:500;color:var(--muted);padding:2px 4px}
.matrix td{font-family:var(--mono);text-align:center;border-radius:6px;padding:8px 4px;min-width:3.4em;color:var(--fg)}
.pf-row{display:grid;grid-template-columns:1fr 6.5em;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pf-row:last-child{border-bottom:0}
.pf-row label small{display:block;color:var(--muted);font-size:.72rem}
.pf-row input{width:100%;font:inherit;font-family:var(--mono);text-align:right;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px}
.big{font-family:var(--mono);font-size:1.5rem;font-weight:600}
.hint{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.warn{color:var(--up);font-weight:600}
.src{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.8rem}
.src .ok{color:var(--down)} .src .ng{color:var(--up)}
.empty{padding:24px;text-align:center;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px}
nav.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:85%;overflow-y:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.close{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.1rem;color:var(--muted)}
.sheet section{display:flex;flex-direction:column;gap:10px;margin-top:16px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card:active{transform:none}}
@media (min-width:560px){.stat{flex-basis:30%}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>ETF 觀察表</h1>
    <p class="sub" id="sub">10 檔追蹤清單</p>
  </header>
  <div class="status" id="status">正在載入資料…</div>

  <!-- 分頁 1：總覽 -->
  <div id="tab-list" class="tab">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="hscroll" id="stats"></div>
      <div class="hscroll" id="chips"></div>
      <div class="bar-row">
        <span class="sub" id="count"></span>
        <select id="sort" aria-label="排序方式">
          <option value="aum">規模 大→小</option>
          <option value="premD">溢價 高→低</option>
          <option value="premA">折價 深→淺</option>
          <option value="yield">殖利率 高→低</option>
          <option value="holders">受益人 多→少</option>
          <option value="fee">管理費 低→高</option>
          <option value="vol">成交量 大→小</option>
        </select>
      </div>
      <div class="list" id="list"><div class="empty">正在載入資料…</div></div>
      <div class="panel">
        <div class="bar-row" style="margin-bottom:8px"><b>資料來源</b><span class="sub" id="genAt"></span></div>
        <div class="src" id="sources"></div>
        <p class="hint">每個交易日 14:23、17:43 自動更新。管理費為手動查核的費率，依目前規模換算級距。</p>
      </div>
    </div>
  </div>

  <!-- 分頁 2：成份股重疊 -->
  <div id="tab-overlap" class="tab" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h2>成份股重疊度</h2>
      <p class="sub">兩檔共同持有的股票，取較低的權重加總。數字越高代表越像同一檔，一起持有的分散效果越差。</p>
      <div class="panel matrix" id="matrix"></div>
      <div class="panel" id="overlapNote"></div>
    </div>
  </div>

  <!-- 分頁 3：我的組合 -->
  <div id="tab-pf" class="tab" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h2>我的組合穿透</h2>
      <p class="sub">輸入持有張數，用最新收盤價和各投信公布的成份股，算出你實際持有哪些個股、各佔多少。</p>
      <div class="panel" id="pfInputs"></div>
      <div class="panel">
        <div class="sub">組合市值（最新收盤價）</div>
        <div class="big" id="pfTotal"></div>
        <div id="pfWarn" class="hint"></div>
      </div>
      <div class="panel">
        <div class="sub" style="margin-bottom:10px">實際曝險（前 8 大）</div>
        <div class="hold" id="pfExpo"></div>
        <p class="hint">以完整成份股拆解；期貨以名目本金計入，槓桿型 ETF 的合計會超過 100%。</p>
      </div>
    </div>
  </div>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-t="list" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>總覽</button>
    <button role="tab" data-t="overlap" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>成份股重疊</button>
    <button role="tab" data-t="pf" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>我的組合</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script>
// ===== 成份股：各投信每日申購買回清單（data/holdings.json）=====
let HOLD={}, HDATA=null;
const KIND={s:"股票",f:"期貨",b:"債券",e:"ETF"};

let DATA=null, ETFS=[], byCode={};
const $=id=>document.getElementById(id);
const isNum=v=>typeof v==="number"&&isFinite(v);
const f=(n,d=2)=>isNum(n)?n.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:"—";
const ymd=s=>s?s.replaceAll("-","/"):"—";
const premHTML=p=>isNum(p)?`<span class="prem ${p>=0.5?"hi":p<=-0.5?"lo":""}">${p>0?"+":""}${f(p)}%</span>`:'<span class="prem">—</span>';
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function fmtTime(iso){if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return iso;return d.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}
const fNav=n=>{if(!isNum(n))return"—";const dec=(String(n).split(".")[1]||"").length;return f(n,Math.min(4,Math.max(2,dec)))};
const holdersWan=e=>isNum(e.holders)?e.holders/1e4:null;
const yieldOf=e=>e.div&&isNum(e.div.yield)?e.div.yield:null;
const feeOf=e=>e.fee&&isNum(e.fee.mgmt)?e.fee.mgmt:null;
function yieldText(e){if(!e.div||e.div.per_year===0)return"不配息";return isNum(e.div.yield)?f(e.div.yield)+"%":"—"}

// ===== 讀資料：同時抓 GitHub 原始檔與網站上的檔案，取較新的那份 =====
function dataUrls(file){
  const urls=["data/"+file];
  const m=location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo=location.pathname.split("/").filter(Boolean)[0];
  if(m&&repo)urls.unshift(`https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/${file}`);
  return urls;
}
async function loadNewest(file,valid){
  const res=await Promise.allSettled(dataUrls(file).map(u=>fetch(u,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})));
  const ok=res.filter(r=>r.status==="fulfilled"&&r.value&&valid(r.value)).map(r=>r.value);
  if(!ok.length)throw new Error("沒有可用的資料");
  ok.sort((a,b)=>String(b.generated_at).localeCompare(String(a.generated_at)));
  return ok[0];
}
const loadData=()=>loadNewest("etf.json",d=>Array.isArray(d.etfs));
const loadHoldings=()=>loadNewest("holdings.json",d=>d.etfs&&typeof d.etfs==="object");
function setHoldings(h){
  HDATA=h;HOLD={};
  Object.entries(h.etfs||{}).forEach(([code,e])=>{
    const items=(e.items||[]).map(([k,c,n,q,w])=>({k,c,n,q,w}));
    const pending=!!(e.client&&CLIENT_PCF[e.client.issuer]&&(e.stale||!items.length));
    HOLD[code]={date:e.date,issuer:e.issuer,stale:!!e.stale,items,pending};
  });
}
const stocksOf=code=>(HOLD[code]?HOLD[code].items.filter(x=>x.k==="s"):[]);

// ===== 網頁端直接向投信讀取 =====
// 國泰的網站會擋 GitHub 的美國主機，但允許其他網站跨網域讀取，所以由使用者的裝置在開啟網頁時直接抓。
const toNum=v=>{if(v==null||v==="")return null;const n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:null};
const isoDate=s=>{const m=String(s||"").match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:null};
const mkItem=(k,c,n,q,w)=>({k,c:String(c??"").trim().replace(/\*+$/,""),n:String(n??"").trim().replace(/\*+$/,""),q:toNum(q),w:toNum(w)});
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("連線逾時")),ms))]);
const CLIENT_PCF={
  async cathay(id){
    const base="https://cwapi.cathaysite.com.tw/api/ETF/", fund=encodeURIComponent(id);
    const get=async u=>{const r=await fetch(base+u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()};
    const a=await get(`GetETFAssets?FundCode=${fund}&status=1`);
    const date=isoDate(a.result&&a.result.preDate);
    if(!date)throw new Error("國泰沒有回傳資料日期");
    const q=`FundCode=${fund}&SearchDate=${date}&status=1`;
    const [s,fu]=await Promise.all([get("GetETFDetailStockList?"+q),get("GetETFDetailFutureList?"+q)]);
    return {date,items:[...(s.result||[]).map(x=>mkItem("s",x.stockCode,x.stockName,x.volumn,x.weights)),
      ...(fu.result||[]).map(x=>mkItem("f",x.ftNo,`${x.ftName||""} ${x.ftDate||""}`.trim(),x.volumn,x.ntMkval))]};
  }
};
async function fillClientHoldings(){
  const jobs=Object.entries((HDATA&&HDATA.etfs)||{}).filter(([c])=>HOLD[c]&&HOLD[c].pending);
  if(!jobs.length)return false;
  try{
    await Promise.all(jobs.map(async([code,e])=>{
      try{
        const r=await withTimeout(CLIENT_PCF[e.client.issuer](e.client.id),15000);
        const items=r.items.filter(x=>x.c&&isNum(x.w)).sort((a,b)=>b.w-a.w);
        if(!items.length)throw new Error("沒有持股資料");
        HOLD[code]={date:r.date,issuer:e.issuer,stale:false,live:true,items};
      }catch(err){HOLD[code].liveError=String((err&&err.message)||err)}
    }));
  }finally{
    Object.values(HOLD).forEach(h=>{h.pending=false});
    Object.values(HDATA.sources||{}).filter(s=>s.client).forEach(s=>{
      s.liveDone=true;
      const hs=(s.codes||[]).map(c=>HOLD[c]).filter(Boolean);
      if(hs.length&&hs.every(h=>h.items.length&&!h.stale)){
        s.ok=true;s.live=hs.some(h=>h.live);s.as_of=hs.map(h=>h.date).filter(Boolean).sort().pop()||s.as_of;
      }
    });
  }
  return true;
}

// ===== 分頁 =====
function showTab(t){
  document.querySelectorAll(".tab").forEach(el=>el.hidden=el.id!=="tab-"+t);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  $("sub").textContent={list:"10 檔追蹤清單 · 點卡片看詳情",overlap:"哪幾檔其實長得一樣",pf:"你實際持有哪些股票"}[t];
  store.set("tab",t);window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));

// ===== 資料狀態 =====
function renderStatus(){
  const s=DATA.sources||{}, hs=(HDATA&&HDATA.sources)||{};
  const all=[...Object.values(s),...Object.values(hs)];
  const waiting=x=>x.client&&!x.ok&&!x.liveDone;  // 等網頁端直接讀取
  const failed=all.filter(x=>!x.ok&&!waiting(x));
  const ageH=(Date.now()-new Date(DATA.generated_at))/36e5;
  const hDates=Object.values(HOLD).map(h=>h.date).filter(Boolean).sort();
  let html=`行情 <b>${md(s.mis&&s.mis.as_of)}</b> 收盤 · 受益人數 <b>${md(s.tdcc&&s.tdcc.as_of)}</b>（集保每週）`
    +(hDates.length?` · 成份股 <b>${md(hDates[hDates.length-1])}</b>`:"")+` · 更新 <b>${fmtTime(DATA.generated_at)}</b>`;
  if(failed.length)html+=`<div class="warnline"><b>⚠️ 部分來源這次沒抓到</b>：${failed.map(x=>x.client?`${esc(x.name)}（這台裝置也連不上，請稍後重新整理）`:`${esc(x.name)}（沿用 ${md(x.as_of)}）`).join("、")}</div>`;
  if(ageH>72)html+=`<div class="warnline"><b>⚠️ 資料超過 3 天沒更新</b>，請到 GitHub Actions 查看排程是否停止。</div>`;
  const warns=[...(DATA.warnings||[]),...((HDATA&&HDATA.warnings)||[])];
  if(warns.length)html+=`<div class="warnline"><b>⚠️ 檢查提醒</b>：${warns.map(esc).join("；")}</div>`;
  $("status").innerHTML=html;
  $("genAt").textContent="更新 "+fmtTime(DATA.generated_at);
  $("sources").innerHTML=all.map(x=>{
    const [cls,txt]=waiting(x)?["","讀取中…"]:x.ok?["ok",`✓ ${x.as_of?md(x.as_of):""}${x.live?" 裝置直連":""}`]:["ng",`✗ ${x.as_of?md(x.as_of):""}`];
    return `<div>${esc(x.name)}</div><div class="num ${cls}">${txt}</div>`;
  }).join("");
}

  const s=[...L].sort((a,b)=>b.prem-a.prem);
  const tot=ETFS.reduce((a,e)=>a+(e.aum||0),0);

  const cards=[];
  if(s.length){const lo=s[s.length-1];cards.push(["溢價最高",s[0].code,premHTML(s[0].prem),s[0].name]);cards.push([lo.prem<0?"折價最深":"溢價最低",lo.code,premHTML(lo.prem),lo.name])}
  if(y)cards.push(["殖利率最高",y.code,f(y.div.yield)+"%",y.name]);
  if(ppl)cards.push(["受益人最多",ppl.code,f(holdersWan(ppl),1)+" 萬人",ppl.name]);

const nz=(v,low)=>isNum(v)?v:(low?Infinity:-Infinity);
const SORTS={
  aum:(a,b)=>nz(b.aum)-nz(a.aum), premD:(a,b)=>nz(b.prem)-nz(a.prem), premA:(a,b)=>nz(a.prem,1)-nz(b.prem,1),
  yield:(a,b)=>nz(yieldOf(b))-nz(yieldOf(a)), holders:(a,b)=>nz(b.holders)-nz(a.holders),

};

      <div><div class="k">經理＋保管</div><div class="v">${isNum(fee.total)?f(fee.total,3)+"%":"—"}</div></div>

      <p class="sub" style="margin:0">手動查核 ${ymd(fee.checked)}${fee.source?` · <a href="${esc(fee.source)}" target="_blank" rel="noopener">來源</a>`:""}</p>
    </section>
    ${holdingsHTML(code,false)}
    <section>
      <b>資料日期</b>
      <dl class="rows">
        <dt>市價／淨值</dt><dd>${ymd(e.quote_date)} ${esc(e.quote_time||"")}</dd>
        <dt>已發行單位</dt><dd>${isNum(e.units)?f(e.units/1e8,2)+" 億單位":"—"}${isNum(e.units_chg)&&e.units_chg!==0?`（${e.units_chg>0?"+":""}${f(e.units_chg/1e3,0)} 張）`:""}</dd>

function qtyText(x){
  if(!isNum(x.q))return"";
  if(x.k==="s"||x.k==="e")return f(x.q/1000,x.q<1e5?1:0)+" 張";
  if(x.k==="f")return f(x.q,0)+" 口";
  if(x.k==="b")return "面額 "+(x.q>=1e8?f(x.q/1e8,2)+" 億":f(x.q/1e4,0)+" 萬");
  return f(x.q,0);
}
function holdingsHTML(code,showAll){
  const H=HOLD[code];
  if(!H||!H.items.length){
    const msg=!HDATA||(H&&H.pending)?"成份股資料讀取中…":H&&H.liveError?`暫時讀不到${esc(H.issuer)}的申購買回清單（${esc(H.liveError)}），請稍後重新整理。`:"目前取不到這檔的成份股資料。";
    return `<section id="holdSec"><b>成份股</b><p class="hint" style="margin:0">${msg}</p></section>`;
  }
  const items=H.items, byK={};
  items.forEach(x=>{const g=(byK[x.k]=byK[x.k]||{n:0,w:0});g.n++;g.w+=x.w||0});
  const st=items.filter(x=>x.k==="s");
  const top10=st.slice(0,10).reduce((a,x)=>a+(x.w||0),0);
  const summary=Object.entries(byK).map(([k,v])=>`${KIND[k]||k} ${v.n} 筆、合計 ${f(v.w,1)}%`).join(" · ")+(st.length>10?` · 前十大股票 ${f(top10,1)}%`:"");
  const list=showAll?items:items.slice(0,10);
  const max=Math.max(1,...list.map(x=>Math.min(Math.abs(x.w||0),100)));
  return `<section id="holdSec">
    <div class="bar-row"><b>成份股${H.stale?'<span class="badge">沿用前次資料</span>':""}</b><span class="sub">${esc(H.issuer)} · ${ymd(H.date)}${H.live?" · 裝置直連":""}</span></div>
    <p class="sub" style="margin:0">${summary}</p>
    <div class="hold">${list.map(x=>`
      <div>${esc(x.n)}<small>${esc(x.k==="s"||x.k==="e"?x.c:(KIND[x.k]||""))}${qtyText(x)?" · "+qtyText(x):""}</small></div>
      <div class="barw"><i style="width:${Math.min(Math.abs(x.w||0),100)/max*100}%"></i></div>
      <div class="r">${f(x.w,2)}%</div>`).join("")}
    </div>
    ${items.length>10?`<button class="chip" id="holdMore" style="align-self:center">${showAll?"只看前 10 筆":`顯示全部 ${items.length} 筆`}</button>`:""}
    <p class="hint" style="margin:0">權重為占基金淨資產比例，期貨以名目本金計算。</p>
  </section>`;
}
function bindHold(code,showAll){

  b.onclick=()=>{$("holdSec").outerHTML=holdingsHTML(code,!showAll);bindHold(code,!showAll)};

// ===== 成份股重疊：兩檔共同持有的股票，取較低權重加總 =====
const STOCK_ETFS=["0050","006208","009816","0052","00981A","0056","00878","00919"];
function overlap(a,b){
  const wb={};stocksOf(b).forEach(x=>{wb[x.c]=x.w||0});
  return stocksOf(a).reduce((s,x)=>s+(wb[x.c]?Math.min(x.w||0,wb[x.c]):0),0);
}
function renderOverlap(){
  const cell=v=>{const a=Math.min(v/80,1);return `background:color-mix(in srgb,var(--accent) ${Math.round(a*85)}%,var(--bg));color:${a>.55?"var(--on-accent)":"var(--fg)"}`};
  let html=`<table><tr><th></th>${STOCK_ETFS.map(c=>`<th>${c}</th>`).join("")}</tr>`;
  STOCK_ETFS.forEach(a=>{
    html+=`<tr><th style="text-align:right">${a}</th>`+STOCK_ETFS.map(b=>{
      if(a===b)return `<td style="background:var(--line);color:var(--muted)">—</td>`;
      const v=overlap(a,b);return `<td style="${cell(v)}">${v?f(v,0):"0"}</td>`;
    }).join("")+"</tr>";
  });
  $("matrix").innerHTML=html+"</table>";
  const pairs=[];
  STOCK_ETFS.forEach((a,i)=>STOCK_ETFS.slice(i+1).forEach(b=>pairs.push([a,b,overlap(a,b)])));
  pairs.sort((x,y)=>y[2]-x[2]);
  const missing=STOCK_ETFS.filter(c=>!stocksOf(c).length);
  const dates=STOCK_ETFS.map(c=>HOLD[c]&&HOLD[c].date).filter(Boolean).sort();
  $("overlapNote").innerHTML=`<b>重疊最高的組合</b><div class="hold" style="margin-top:10px;grid-template-columns:auto 1fr auto">${pairs.slice(0,5).map(([a,b,v])=>`
    <div class="num">${a} × ${b}</div><div class="barw"><i style="width:${Math.min(v,100)}%"></i></div><div class="r">${f(v,1)}%</div>`).join("")}</div>
    <p class="hint">用各投信公布的完整股票成份計算${dates.length?`（資料日 ${md(dates[0])}${dates[0]!==dates[dates.length-1]?"–"+md(dates[dates.length-1]):""}）`:""}。${missing.length?`缺少 ${missing.join("、")} 的資料，相關格子會偏低。`:""}</p>`;
}

let pf=store.get("pf",{"0050":2,"006208":3,"0056":5,"00878":5});
function renderPfInputs(){
  $("pfInputs").innerHTML=ETFS.map(e=>`
    <div class="pf-row"><label for="pf-${e.code}"><span class="num" style="color:var(--accent);font-weight:600">${e.code}</span> ${esc(e.name)}<small>市價 ${f(e.price)}</small></label>
    <input id="pf-${e.code}" type="number" inputmode="decimal" min="0" step="1" placeholder="0 張" value="${pf[e.code]||""}"></div>`).join("");
  $("pfInputs").querySelectorAll("input").forEach(i=>i.oninput=()=>{
    const c=i.id.slice(3),v=parseFloat(i.value);
    if(v>0)pf[c]=v;else delete pf[c];
    store.set("pf",pf);renderPf();
  });

function futKey(x){
  const s=x.c+" "+x.n;
  if(/電子/.test(s))return["f:TE","電子期貨"];
  if(/金融/.test(s))return["f:TF","金融期貨"];
  if(/50ETF|NYF|台灣50/.test(s))return["f:NYF","台灣50ETF期貨"];
  if(/TX|台股|臺股|台指|臺指/.test(s))return["f:TX","台股期貨"];
  return["f:"+x.c,x.n.replace(/\s*\d{4}\/?\d{2}\s*/g," ").trim()||x.c];
}
function renderPf(){
  let total=0;const expo={},names={},missing=[];
  const add=(k,n,v)=>{expo[k]=(expo[k]||0)+v;names[k]=names[k]||n};
  Object.entries(pf).forEach(([c,lots])=>{
    const e=byCode[c];if(!e||!isNum(e.price))return;
    const val=lots*1000*e.price;total+=val;
    const H=HOLD[c];
    if(!H||!H.items.length){missing.push(c);add("x:"+c,`${c}（成份股未取得）`,val);return}
    let used=0;
    H.items.forEach(x=>{
      const w=x.w||0;used+=w;
      if(x.k==="s")add("s:"+x.c,x.n,val*w/100);
      else if(x.k==="f"){const[k,n]=futKey(x);add(k,n+"（曝險）",val*w/100)}
      else if(x.k==="b")add("b:"+c,`${e.name} 債券部位`,val*w/100);
      else add("e:"+x.c,x.n,val*w/100);
    });
    if(used<100)add("cash","現金與其他",val*(100-used)/100);
  });
  $("pfTotal").textContent=total?"NT$ "+f(total,0):"尚未輸入持股";
  const sorted=Object.entries(expo).filter(([k])=>k!=="cash").sort((a,b)=>b[1]-a[1]);
  const rows=sorted.slice(0,8), rest=sorted.slice(8).reduce((a,[,v])=>a+v,0)+(expo.cash||0);
  if(rest>0)rows.push(["rest",rest]);names.rest=`其他 ${sorted.length>8?sorted.length-8+" 項＋":""}現金`;
  const max=Math.max(...rows.map(r=>r[1]),1);
  $("pfExpo").innerHTML=total?rows.map(([k,v])=>`
    <div>${esc(names[k])}<small>NT$ ${f(v/1e4,0)} 萬</small></div>
    <div class="barw"><i style="width:${v/max*100}%"></i></div>
    <div class="r">${f(v/total*100,1)}%</div>`).join(""):`<div class="sub" style="grid-column:1/-1">在上方輸入任一檔的張數就會開始計算。</div>`;
  const exposure=total?Object.values(expo).reduce((a,v)=>a+v,0)/total*100:0;
  const tsmc=total?(expo["s:2330"]||0)/total*100:0;
  const top=sorted.find(([k])=>k.startsWith("s:"));
  let msg=tsmc>=30?`<span class="warn">⚠️ 台積電約佔 ${f(tsmc,1)}%</span>，單一個股集中度偏高。`:total&&top?`最大單一個股是${esc(names[top[0]])}，約佔 ${f(top[1]/total*100,1)}%。`:"";
  if(exposure>110)msg+=` 含槓桿後總曝險約 ${f(exposure,0)}%。`;
  if(missing.length)msg+=` ${missing.join("、")} 的成份股暫時取不到，未拆解。`;
  $("pfWarn").innerHTML=msg;
}
