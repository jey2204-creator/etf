name: 新增或刪除 ETF

# 在網頁按「新增／刪除」會開一張 Issue，標題「新增 ETF 00713」或「刪除 ETF 0056」。
# 只有 repo 擁有者開的 Issue 才會執行，其他人開的一律忽略。
# 每次執行都會把「所有還開著的」新增／刪除 Issue 一起處理（連續開多張時，排隊中的會被 GitHub 取消，
# 由最後一次一併補做）；排程的「更新 ETF 資料」也會順便處理。
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  manage:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '新增') || startsWith(github.event.issue.title, '刪除') || startsWith(github.event.issue.title, '移除')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 取得程式碼
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: 修改清單（所有開著的 Issue）
        working-directory: repo
        run: python3 scripts/process_issues.py apply

      - name: 立即更新資料並提交
        if: env.ISSUES_CHANGED != ''
        working-directory: repo
        run: |
          python3 scripts/update.py || echo "部分來源失敗，沿用前次資料"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/ data/
          git commit -m "清單變更：${ISSUES_CHANGED}"
          git pull --rebase --quiet
          git push

      - name: 回覆並關閉 Issue
        working-directory: repo
        run: python3 scripts/process_issues.py reply
