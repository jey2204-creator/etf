name: 更新 ETF 資料

on:
  schedule:
    - cron: "23 6 * * 1-5"   # 台灣時間 14:23（收盤後第一次更新）
    - cron: "43 9 * * 1-5"   # 台灣時間 17:43（投信更新淨值後再抓一次）
  workflow_dispatch:          # 可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取得程式碼
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: 抓取資料
        working-directory: repo
        run: |
          python3 --version
          python3 scripts/update.py || echo "PARTIAL=1" >> "$GITHUB_ENV"

      - name: 提交更新
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "資料沒有變動"; exit 0; fi
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push

      - name: 回報來源異常
        if: env.PARTIAL == '1'
        run: |
          echo "::warning::部分資料來源抓取失敗，網頁沿用上一次成功的資料。詳見 data/etf.json 的 sources。"
          exit 1
